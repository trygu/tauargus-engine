# One-shot: permanently delete the stale GHCR container package
# (ghcr.io/trygu/tauargus-engine, tags 0.2.1-0.5.2 + latest). Container
# images are no longer an engine artifact; a containerized deployment
# will ship with the web front-end from the product side, if ever.
# Deleting a package removes every version of it. Delete this workflow
# after the run.
name: gcr-cleanup

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "GHCR package name to delete (no registry prefix)"
        required: true
        default: "tauargus-engine"

permissions:
  packages: write

jobs:
  delete:
    runs-on: ubuntu-24.04
    steps:
      - name: Guard
        env:
          PKG: ${{ github.event.inputs.package_name }}
        run: |
          # Only allow deleting the one stale package this workflow exists for.
          case "$PKG" in
            tauargus-engine) ;;
            *) echo "refusing to delete unexpected package '$PKG'"; exit 1 ;;
          esac

      - name: Delete package (all versions)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: ${{ github.event.inputs.package_name }}
        run: |
          set -uo pipefail
          # The registry serves the package, but the earlier probes came up
          # empty. Probe every plausible listing endpoint and print what
          # each returns before deciding.
          list() { gh api "$1" --jq '.[].name' 2>&1 || echo "(call failed)"; }
          echo "== /user/packages (no filter):"; list "/user/packages?per_page=100"
          echo "== /user/packages?package_type=docker:"; list "/user/packages?package_type=docker&per_page=100"
          echo "== /user/packages?package_type=container:"; list "/user/packages?package_type=container&per_page=100"
          echo "== /users/trygu/packages:"; list "/users/trygu/packages?per_page=100"
          # Collect the id from whichever endpoint lists the package.
          id=""
          for ep in "/user/packages?per_page=100" \
                    "/user/packages?package_type=docker&per_page=100" \
                    "/users/trygu/packages?per_page=100"; do
            id=$(gh api "$ep" --jq ".[] | select(.name | test(\"$PKG\$\")) | .id" 2>/dev/null || true)
            [ -n "$id" ] && break
          done
          if [ -z "$id" ]; then
            echo "package $PKG not found in any listing; see diagnostics above"
            exit 1
          fi
          echo "found package id=$id ($PKG)"
          for v in $(gh api "/user/packages/$id/versions?per_page=100" --jq '.[].id'); do
            echo "deleting version id=$v"
            gh api -X DELETE "/user/packages/$id/versions/$v"
          done
          echo "deleting package id=$id"
          gh api -X DELETE "/user/packages/$id"
          echo "done"
