name: tui-package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - bindings/tui/**
      - .github/workflows/tui-release.yml
      - .github/scripts/check_tui_dist.py
      - .github/tests/test_tui_distribution.py
      - docs/tui-publishing.md
  push:
    branches: [master, tui]
    tags: ["tui-v*"]
    paths:
      - bindings/tui/**
      - .github/workflows/tui-release.yml
      - .github/scripts/check_tui_dist.py
      - .github/tests/test_tui_distribution.py
      - docs/tui-publishing.md

permissions:
  contents: read

concurrency:
  group: tui-package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Check distribution guards
        run: python -m unittest discover -s .github/tests -p test_tui_distribution.py
      - name: Build standalone TUI distributions
        run: python -m build --outdir dist bindings/tui
      - name: Validate package boundary and release version
        env:
          TUI_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/tui-v') && github.ref_name || '' }}
        run: python .github/scripts/check_tui_dist.py dist --tag "$TUI_RELEASE_TAG"
      - name: Check PyPI metadata
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: tui-distributions
          path: dist/
          if-no-files-found: error

  test-installed:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: tui-distributions
          path: dist/
      - name: Install built wheel with released dependencies
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          wheel = next(Path("dist").glob("*.whl"))
          subprocess.run([sys.executable, "-m", "pip", "install", f"{wheel}[test]"], check=True)
          PY
      - name: Check console command
        run: tauargus-tui --help
      - name: Test installed TUI against published engine
        run: python -m pytest bindings/tui/tests -q

  publish-pypi:
    needs: [build, test-installed]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/tui-v')
    runs-on: ubuntu-24.04
    environment:
      name: pypi-tui
      url: https://pypi.org/project/pytauargus-tui/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tui-distributions
          path: dist/
      - name: Publish TUI through its own trusted publisher
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/tui-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tui-distributions
          path: dist/
      - name: Attach TUI distributions to its release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TUI_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # A TUI release must not replace the engine's "latest" release link.
          if ! gh release view "$TUI_RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$TUI_RELEASE_TAG" --verify-tag --latest=false \
              --title "pytauargus-tui ${TUI_RELEASE_TAG#tui-v}" --generate-notes
          fi
          gh release upload "$TUI_RELEASE_TAG" dist/* --clobber
