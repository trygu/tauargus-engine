# Build and test both Python packages; py-v* tags publish both to PyPI,
# one GitHub Release and the engine container image.
#
# Why a manual matrix instead of cibuildwheel: the Python build links
# against a pre-built engine in the sibling `engine/` dir
# (bindings/python/CMakeLists.txt -> ../../engine/build/lib). cibuildwheel
# copies only the package dir into its container and would not see engine/.
#
# Each build job:
#   1. builds HiGHS from source (version-pinned, cached),
#   2. builds the tauargus engine superbuild (cached),
#   3. builds the pytauargus wheel for one CPython via `pip wheel`,
#   4. repairs the wheel so HiGHS + engine libs are bundled
#      (delocate / auditwheel / delvewheel) -> self-contained wheel,
#   5. uploads it as an artifact.
#
# Publish the engine and matching TUI only after the installed pair passes.
# The image job uses Linux engine wheels; Textual stays out of the container.

name: Release
run-name: Release · ${{ github.ref_name }}

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    tags: ["py-v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  HIGHS_TAG: v1.15.1

# ---------------------------------------------------------------------------
# Shared build recipe, inlined per job (GitHub Actions has no job-level
# function inclusion). Keep the three copies in sync.
# ---------------------------------------------------------------------------

jobs:
  build-tui:
    name: Package · TUI
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check release contracts
        run: python -m unittest discover -s .github/tests
      - name: Verify shared release version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/py-v') && github.ref_name || '' }}
        run: python .github/scripts/python_release.py --tag "$RELEASE_TAG"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build TUI wheel and source distribution
        run: python -m build --outdir dist bindings/tui
      - name: Check TUI distributions
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/py-v') && github.ref_name || '' }}
        run: |
          python .github/scripts/check_tui_dist.py dist --tag "$RELEASE_TAG"
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: pytauargus-tui-distributions
          path: dist/
          if-no-files-found: error

  validate:
    name: Versions + tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check release contracts
        run: python -m unittest discover -s .github/tests
      - name: Verify shared release version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/py-v') && github.ref_name || '' }}
        run: python .github/scripts/python_release.py --tag "$RELEASE_TAG"

  build-macos:
    name: Wheel · macOS arm64 · ${{ matrix.python }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build HiGHS from source (cached)
        id: highs
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="$RUNNER_TEMP/highs-prefix"
          if [ -f "$PREFIX/.done" ]; then
            echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git clone --depth 1 --branch "$HIGHS_TAG" \
            https://github.com/ERGO-Code/HiGHS.git highs
          cmake -S highs -B highs/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX="$PREFIX"
          cmake --build highs/build -j
          cmake --install highs/build
          touch "$PREFIX/.done"
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"

      - name: Build engine superbuild (cached)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "engine/build/.done" ]; then
            echo "engine already built"
            exit 0
          fi
          cmake -S engine -B engine/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DHighs_DIR="${{ steps.highs.outputs.prefix }}/lib/cmake/Highs"
          cmake --build engine/build -j
          touch engine/build/.done

      - name: Build wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "scikit-build-core>=0.10" "pybind11>=2.13"
          python -m pip wheel bindings/python --no-deps -w wheelhouse

      - name: Repair wheel (bundle HiGHS + engine libs)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install delocate
          delocate-listdeps wheelhouse/*.whl || true
          delocate-wheel -w repaired wheelhouse/*.whl

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: pytauargus-macos-arm64-py${{ matrix.python }}
          path: repaired/*.whl
          if-no-files-found: error

  build-linux:
    name: Wheel · Linux ${{ matrix.arch }} · ${{ matrix.python-version }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    container:
      image: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}:latest
    strategy:
      fail-fast: false
      matrix:
        python: ["cp310-cp310", "cp311-cp311", "cp312-cp312", "cp313-cp313"]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - python: cp310-cp310
            python-version: "3.10"
          - python: cp311-cp311
            python-version: "3.11"
          - python: cp312-cp312
            python-version: "3.12"
          - python: cp313-cp313
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain (cmake/ninja/auditwheel)
        run: /opt/python/${{ matrix.python }}/bin/pip install cmake ninja "auditwheel>=6" "scikit-build-core>=0.10" "pybind11>=2.13"

      - name: Build HiGHS from source
        id: highs
        run: |
          set -euo pipefail
          PREFIX="$GITHUB_WORKSPACE/highs-prefix"
          git clone --depth 1 --branch "$HIGHS_TAG" \
            https://github.com/ERGO-Code/HiGHS.git highs
          cmake -S highs -B highs/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          cmake --build highs/build -j
          cmake --install highs/build
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"

      - name: Build engine superbuild
        run: |
          set -euo pipefail
          cmake -S engine -B engine/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DHighs_DIR="$(dirname "$(find "${{ steps.highs.outputs.prefix }}" -name "[Hh]ighs[Cc]onfig.cmake" -o -name highs-config.cmake | head -n1)")"
          cmake --build engine/build -j

      - name: Build wheel
        run: |
          set -euo pipefail
          /opt/python/${{ matrix.python }}/bin/pip wheel \
            bindings/python --no-deps -w wheelhouse

      - name: Repair wheel (bundle HiGHS + engine libs)
        run: |
          set -euo pipefail
          auditwheel repair wheelhouse/*.whl -w repaired

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: pytauargus-manylinux-${{ matrix.arch }}-py${{ matrix.python }}
          path: repaired/*.whl
          if-no-files-found: error

  build-windows:
    name: Wheel · Windows x64 · ${{ matrix.python }}
    needs: validate
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build HiGHS from source (cached)
        id: highs
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="$RUNNER_TEMP/highs-prefix"
          if [ -f "$PREFIX/.done" ]; then
            echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git clone --depth 1 --branch "$HIGHS_TAG" \
            https://github.com/ERGO-Code/HiGHS.git highs
          cmake -S highs -B highs/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX="$PREFIX"
          cmake --build highs/build -j --config Release
          cmake --install highs/build --config Release
          touch "$PREFIX/.done"
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"

      - name: Build engine superbuild (cached)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "engine/build/.done" ]; then
            echo "engine already built"
            exit 0
          fi
          cmake -S engine -B engine/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DHighs_DIR="$(dirname "$(find "${{ steps.highs.outputs.prefix }}" -name "[Hh]ighs[Cc]onfig.cmake" -o -name highs-config.cmake | head -n1)")"
          cmake --build engine/build -j --config Release
          touch engine/build/.done

      - name: Build wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "scikit-build-core>=0.10" "pybind11>=2.13"
          python -m pip wheel bindings/python --no-deps -w wheelhouse

      - name: Repair wheel (bundle HiGHS + engine DLLs)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install delvewheel
          ENGINE_BIN="$(cygpath -w "$GITHUB_WORKSPACE/engine/build/bin/Release")"
          HIGHS_BIN="$(cygpath -w "$RUNNER_TEMP/highs-prefix/bin")"
          delvewheel repair --add-path "$ENGINE_BIN;$HIGHS_BIN" -w repaired wheelhouse/*.whl

      - name: Smoke test wheel in a clean venv
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/Scripts/python.exe" -m pip install repaired/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/Scripts/tauargus.exe" --version
          "$RUNNER_TEMP/smoke/Scripts/python.exe" -c "import pytauargus, pytauargus._tauargus as m; print('ok', m.__file__)"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: pytauargus-windows-py${{ matrix.python }}
          path: repaired/*.whl
          if-no-files-found: error

  test-installed:
    name: Install · ${{ matrix.platform }} · ${{ matrix.python }}
    needs: [build-macos, build-linux, build-windows, build-tui]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, windows-2022]
        include:
          - os: ubuntu-24.04
            platform: Linux x64
          - os: ubuntu-24.04-arm
            platform: Linux arm64
          - os: macos-14
            platform: macOS arm64
          - os: windows-2022
            platform: Windows x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          pattern: pytauargus-*
          path: dist/
          merge-multiple: true
      - name: Install engine and TUI from this build
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          from email.parser import BytesParser
          from zipfile import ZipFile

          tui = next(Path("dist").glob("pytauargus_tui-*.whl"))
          with ZipFile(tui) as wheel:
              info = next(name for name in wheel.namelist() if name.endswith(".dist-info/METADATA"))
              version = BytesParser().parsebytes(wheel.read(info))["Version"]
          subprocess.run([sys.executable, "-m", "pip", "install", "--no-index",
                          "--find-links", "dist", f"pytauargus=={version}"], check=True)
          subprocess.run([sys.executable, "-m", "pip", "install", f"{tui}[test]"], check=True)
          PY
      - name: Check commands
        shell: bash
        run: |
          tauargus --version
          tauargus-tui --help
      - name: Test installed TUI with matching engine
        run: python -m pytest bindings/tui/tests -q

  publish-engine:
    name: PyPI · Engine
    needs: [test-installed]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/py-v')
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pytauargus-*
          path: dist
          merge-multiple: true
      - name: Separate engine distributions
        shell: bash
        run: |
          mkdir engine-dist
          find dist -maxdepth 1 -name 'pytauargus-*.whl' -exec cp {} engine-dist/ \;
      - name: Publish engine to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: engine-dist/
          skip-existing: true

  publish-tui:
    name: PyPI · TUI
    needs: publish-engine
    runs-on: ubuntu-24.04
    environment:
      name: pypi-tui
      url: https://pypi.org/project/pytauargus-tui/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pytauargus-tui-distributions
          path: dist/
      - name: Publish matching TUI to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  release:
    name: GitHub release
    needs: publish-tui
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pytauargus-*
          path: dist/
          merge-multiple: true
      - name: Attach both packages to one release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true

  image:
    name: Container · GHCR
    needs: [release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    # The GHCR package name is explicit (not github.repository) so the
    # container image can be renamed independently of the repo.
    env:
      IMAGE_REPO: ghcr.io/trygu/tauargus-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: pytauargus-manylinux-*
          path: dist
          merge-multiple: true

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build image and smoke test
        uses: docker/build-push-action@v6
        with:
          context: dist
          file: Dockerfile
          load: true
          tags: tauargus:test

      - name: Run smoke test
        run: docker run --rm tauargus:test --version

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image version
        run: echo "VERSION=${GITHUB_REF_NAME#py-v}" >> "$GITHUB_ENV"

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: dist
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.VERSION }}
            ${{ env.IMAGE_REPO }}:latest
