# Build, test and release the distributable tauargusengine R package.
#
# - build: stage the self-contained source package (engine + HiGHS sources),
#   install it from scratch (its configure builds the native libs from the
#   package's own sources), run the binding smoke test, and repackage the
#   installed package as a platform binary (gzipped tarball on
#   Linux/macOS, zip on Windows; names carry platform, arch and R version).
# - clean-room: on a bare ubuntu:24.04 container with no checkout, no
#   compiler and no engine build, install the Linux binary and run the
#   smoke test from the installed package.
# - publish (r-v* tags only): attach the source package and the three
#   platform binaries to a GitHub Release. The release files are the only
#   distribution channel (no separate R package registry).
#
# Releases are lockstep with the Python binding: the same version ships as
# py-vX.Y.Z in the pytauargus repo (see AGENTS.md, Releasing).

name: r-package

on:
  pull_request:
    branches: [master]
  push:
    tags: ["r-v*"]
  workflow_dispatch:

concurrency:
  group: r-package-${{ github.ref }}
  cancel-in-progress: true

env:
  R_VERSION: "4.4.3"

jobs:
  build:
    name: ${{ matrix.osname }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, osname: linux, arch: x86_64 }
          - { os: macos-15, osname: macos, arch: arm64 }
          - { os: windows-2022, osname: windows, arch: x86_64 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}

      # Stage the distributable source package. On a release tag the
      # version comes from the tag (r-vX.Y.Z -> X.Y.Z).
      - name: Stage the R package
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/r-v* ]]; then
            scripts/stage-r-package.sh --version "${GITHUB_REF#refs/tags/r-v}"
          else
            scripts/stage-r-package.sh
          fi

      # The source package is platform-neutral; build it once (on linux).
      # It must run before the install below: R CMD INSTALL runs configure
      # in place on the staged directory, which consumes the bundled
      # sources (inst/engine, inst/highs).
      - name: Build the source package
        if: matrix.osname == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/dist
          (cd build/dist && R CMD build "$GITHUB_WORKSPACE/build/r-package/tauargusengine")

      # Install from the staged sources: configure builds HiGHS and the
      # engine from the package's own sources. The clean-room job later
      # verifies that no absolute build paths survive in the binaries.
      #
      # The binary package is the installed package directory, repackaged:
      # no compiler is needed to install it.
      - name: Install, smoke-test, package the binary
        shell: bash
        run: |
          set -euo pipefail
          RLIB="$(mktemp -d)/Rlib"
          mkdir -p "$RLIB"
          R CMD INSTALL --library="$RLIB" build/r-package/tauargusengine
          R_LIBS="$RLIB" Rscript build/r-package/tauargusengine/tests/test_binding_smoke.R
          mkdir -p build/bin
          VER="$(awk -F': ' '/^Version:/{print $2; exit}' build/r-package/tauargusengine/DESCRIPTION)"
          RVER="$(Rscript -e 'cat(R.version$major, ".", R.version$minor, sep = "")')"
          NAME="tauargusengine_${VER}_r${RVER}_${{ matrix.osname }}-${{ matrix.arch }}"
          if [ "${{ matrix.osname }}" = "windows" ]; then
            # Standard R Windows binary format: a zip of the installed
            # package directory (bsdtar picks the format from -a).
            tar -a -c -f "build/bin/${NAME}.zip" -C "$RLIB" tauargusengine
          else
            # Standard R Linux/macOS binary format: gzipped tarball of the
            # installed package directory.
            tar -czf "build/bin/${NAME}.tar.gz" -C "$RLIB" tauargusengine
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.osname }}-${{ matrix.arch }}
          path: build/bin/tauargusengine_*

      - name: Upload source
        if: matrix.osname == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: source
          path: build/dist/tauargusengine_*.tar.gz

  clean-room:
    name: clean-room (linux binary, no checkout)
    needs: build
    if: startsWith(github.ref, 'refs/tags/r-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    steps:
      - name: Install system deps
        run: |
          apt-get update
          # setup-r needs sudo, which the bare ubuntu image lacks.
          apt-get install -y --no-install-recommends binutils ca-certificates sudo

      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-x86_64
          path: pkg

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}

      - name: Install the binary and run the smoke test
        shell: bash
        run: |
          set -euo pipefail
          RLIB="$(mktemp -d)/Rlib"
          mkdir -p "$RLIB"
          R CMD INSTALL --library="$RLIB" pkg/tauargusengine_*.tar.gz
          # tests/ is not part of an installed package, so the smoke
          # runs inline from the installed library only.
          R_LIBS="$RLIB" Rscript -e '
            library(tauargusengine)
            engine <- new_tauargus()
            version <- tauargus_version(engine)
            stopifnot(nchar(version) > 0L)
            stopifnot(!is.null(new_hitas()), !is.null(new_rounder()))
            meta <- tauargus_engine_meta()
            stopifnot(!is.na(meta[["engine_sha"]]),
                      nchar(meta[["highs_version"]]) > 0L)
            cat("clean-room smoke ok:", version, "\n")'

          # No build paths may be referenced by the loaded objects.
          LDD="$(ldd "$RLIB/tauargusengine/libs/tauargusengine.so")"
          echo "$LDD"
          if echo "$LDD" | grep -E "not found"; then
            echo "clean-room: missing shared object" >&2
            exit 1
          fi
          echo "clean-room: ok"

  publish:
    name: publish (GitHub Release)
    needs: build
    if: startsWith(github.ref, 'refs/tags/r-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist

      - name: Check the tag matches the package version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/r-v}"
          VER="$(tar -xzOf dist/source/tauargusengine_*.tar.gz tauargusengine/DESCRIPTION \
                  | awk -F': ' '/^Version:/{print $2; exit}')"
          if [[ "$VER" != "$TAG" ]]; then
            echo "tag r-v$TAG does not match package version $VER" >&2
            exit 1
          fi
          echo "version: $VER"

      - name: GitHub Release with source + binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/source/*.tar.gz
            dist/bin-linux-x86_64/*
            dist/bin-macos-arm64/*
            dist/bin-windows-x86_64/*
          generate_release_notes: true
          body: |
            Self-contained `tauargusengine` R package. `tauargus_engine_meta()`
            reports the exact engine SHA and HiGHS version this build came
            from. These release files are the distribution channel; install
            the one that matches your platform.

            Binary (no compiler; R 4.4.3):

                install.packages(
                  "https://github.com/trygu/tauargus-engine/releases/download/r-vX.Y.Z/tauargusengine_X.Y.Z_r4.4.3_linux-x86_64.tar.gz",
                  repos = NULL, type = "binary")

            (macOS: ..._macos-arm64.tar.gz; Windows: ..._windows-x86_64.zip)

            Source (any platform; needs CMake >= 3.16 and a C++11 compiler):

                install.packages(
                  "https://github.com/trygu/tauargus-engine/releases/download/r-vX.Y.Z/tauargusengine_X.Y.Z.tar.gz",
                  repos = NULL)
