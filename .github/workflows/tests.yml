# Check the engine, TUI and package contracts. Releases live in wheels.yml.

name: Checks
run-name: Checks · ${{ github.head_ref || github.ref_name }}

permissions:
  contents: read

on:
  push:
    branches: [master, tui]
  pull_request:
    branches: [master, tui]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HIGHS_TAG: v1.15.1

jobs:
  build-tui:
    name: Package · TUI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check release contracts
        run: python -m unittest discover -s .github/tests
      - name: Verify shared release version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/py-v') && github.ref_name || '' }}
        run: python .github/scripts/python_release.py --tag "$RELEASE_TAG"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build TUI wheel and source distribution
        run: python -m build --outdir dist bindings/tui
      - name: Check TUI distributions
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/py-v') && github.ref_name || '' }}
        run: |
          python .github/scripts/check_tui_dist.py dist --tag "$RELEASE_TAG"
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: pytauargus-tui-distributions
          path: dist/
          if-no-files-found: error

  engine-tui:
    name: Engine + TUI · ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: Linux x64
          - os: ubuntu-24.04-arm
            platform: Linux arm64
          - os: macos-15
            platform: macOS arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v5

      - name: Cache HiGHS
        id: highs-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/highs-prefix
          key: highs-${{ matrix.os }}-${{ env.HIGHS_TAG }}

      - name: Build HiGHS from source
        if: steps.highs-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$HIGHS_TAG" https://github.com/ERGO-Code/HiGHS.git highs
          cmake -S highs -B highs/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/highs-prefix"
          cmake --build highs/build -j
          cmake --install highs/build

      - name: Build engine
        run: |
          set -euo pipefail
          HIGHS_CFG="$(dirname "$(find "$RUNNER_TEMP/highs-prefix" -name 'highs-config.cmake' -o -name 'highsConfig.cmake' -o -name 'HighsConfig.cmake' | head -n1)")"
          cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release -DHighs_DIR="$HIGHS_CFG" \
            -DTAUARGUS_CORE_BUILD_TESTS=ON
          cmake --build engine/build -j

      - name: Test native core
        run: ctest --test-dir engine/build/native/core --output-on-failure

      - name: Install local engine
        working-directory: bindings/python
        run: uv sync --extra test

      - name: Test Python engine
        working-directory: bindings/python
        run: uv run pytest -q

      - name: Install TUI with local engine
        run: uv pip install --python bindings/python/.venv/bin/python './bindings/tui[test]'

      - name: Test TUI
        run: bindings/python/.venv/bin/python -m pytest bindings/tui/tests -q
