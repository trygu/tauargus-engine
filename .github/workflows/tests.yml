# Build the engine and run the binding tests on every push and PR.
# (Wheel building and releasing live in the pytauargus repo; the R
# package build and release live in the rtauargus.native repo.)

name: Engine — Native and binding tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# The step scripts are bash on every platform (the windows runner
# provides Git Bash); this matches the product workflows, which build
# the same engine on Windows the same way.
defaults:
  run:
    shell: bash

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test native code and bindings — ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, label: "Linux x86_64" }
          - { os: ubuntu-24.04-arm, label: "Linux arm64" }
          - { os: macos-15, label: "macOS arm64" }
          - { os: windows-2022, label: "Windows x86_64" }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v5

      # The HiGHS version is pinned in engine/HiGHS-VERSION (single source of
      # truth); the CMake build and these workflows read the same file.
      - name: Read HiGHS pin
        id: pin
        run: echo "tag=$(tr -d '[:space:]' < engine/HiGHS-VERSION)" >> "$GITHUB_OUTPUT"

      # HiGHS is built static (as the staged R release build does) so the
      # engine libraries are self-contained: the bundle step must not
      # ship a separate HiGHS runtime. The cache key carries the "static"
      # qualifier so a stale shared-library cache entry is never hit.
      - name: Cache HiGHS
        id: highs-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/highs-prefix
          key: highs-static-${{ matrix.os }}-${{ steps.pin.outputs.tag }}

      # On Windows CMake picks the multi-config Visual Studio generator
      # (the same recipe the pytauargus wheel build uses); Release must
      # be selected for build, install and ctest. The Unix jobs use
      # single-config generators where the flags are absent.
      - name: Build HiGHS from source
        if: steps.highs-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ steps.pin.outputs.tag }}" https://github.com/ERGO-Code/HiGHS.git highs
          cmake -S highs -B highs/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/highs-prefix"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake --build highs/build -j --config Release
            cmake --install highs/build --config Release
          else
            cmake --build highs/build -j
            cmake --install highs/build
          fi

      - name: Build engine
        run: |
          set -euo pipefail
          HIGHS_CFG="$(dirname "$(find "$RUNNER_TEMP/highs-prefix" -name 'highs-config.cmake' -o -name 'highsConfig.cmake' -o -name 'HighsConfig.cmake' | head -n1)")"
          cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release -DHighs_DIR="$HIGHS_CFG" \
            -DTAUARGUS_CORE_BUILD_TESTS=ON
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake --build engine/build -j --config Release
          else
            cmake --build engine/build -j
          fi

      - name: Test native core
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            ctest --test-dir engine/build/native/core --output-on-failure --build-config Release
          else
            ctest --test-dir engine/build/native/core --output-on-failure
          fi

      - name: Build and test Python binding
        working-directory: bindings/python
        run: uv run --with pytest --with pybind11 pytest tests -q

      - name: Install R (apt)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y r-base

      - name: Install R (Homebrew)
        if: runner.os == 'macOS'
        run: brew install r

      # Same R as the product release builds; on Windows setup-r also
      # installs Rtools, which the MinGW engine build below needs. It runs
      # after the MSVC builds on purpose: its PATH additions put Rtools'
      # MSYS cmake ahead of the runner's native cmake, and the MSYS cmake
      # defaults to Unix Makefiles instead of Visual Studio.
      - name: Install R (setup-r)
        if: runner.os == 'Windows'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"

      # The R binding is compiled with Rtools' MinGW and uses the engine
      # core's C++ API, so it must link a core built with the same
      # toolchain (the MSVC core's C++ symbols are not resolvable from
      # MinGW). Build a second MinGW copy of HiGHS and the engine for the
      # R binding check only (the recipe the staged R release build
      # uses); the MSVC build serves the native tests, the Python
      # binding and the artifact bundle.
      - name: Build HiGHS (MinGW, for the R binding)
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          # Pin the compilers to Rtools' MinGW. CMake's own discovery
          # picks the runner's Clang (C:\Program Files\LLVM), which
          # targets MSVC headers and cannot build the MinGW toolchain.
          # The same Rtools ladder the staged R release build uses, plus
          # the standard install paths (Rtools4* lives in lowercase
          # C:\rtools4N, older Rtools in C:\Rtools). The RTOOLS4*_HOME
          # values use backslashes, which bash cannot test as paths, so
          # they are normalized first.
          RT=""
          for e in RTOOLS45_HOME RTOOLS44_HOME RTOOLS43_HOME; do
            v="${!e}"
            v="${v//\\//}"
            if [ -n "$v" ] && [ -x "$v/mingw64/bin/gcc.exe" ]; then RT="$v"; break; fi
          done
          if [ -z "$RT" ]; then
            for v in "C:/rtools45" "C:/rtools44" "C:/rtools43" "C:/Rtools"; do
              if [ -x "$v/mingw64/bin/gcc.exe" ]; then RT="$v"; break; fi
            done
          fi
          [ -n "$RT" ] || { echo "Rtools not found (set RTOOLS4*_HOME)" >&2; exit 1; }
          echo "RT_BIN=$RT/mingw64/bin" >> "$GITHUB_ENV"
          # The MSVC build step clones the HiGHS source only on a cache
          # miss; make sure the source is present for this build too.
          [ -d highs ] || git clone --depth 1 --branch "${{ steps.pin.outputs.tag }}" https://github.com/ERGO-Code/HiGHS.git highs
          cmake -S highs -B highs/build-mingw -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_C_COMPILER="$RT/mingw64/bin/gcc" \
            -DCMAKE_CXX_COMPILER="$RT/mingw64/bin/g++" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/highs-prefix-mingw"
          cmake --build highs/build-mingw -j
          cmake --install highs/build-mingw

      - name: Build engine (MinGW, for the R binding)
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          HIGHS_CFG="$(dirname "$(find "$RUNNER_TEMP/highs-prefix-mingw" -name 'highs-config.cmake' -o -name 'highsConfig.cmake' -o -name 'HighsConfig.cmake' | head -n1)")"
          cmake -S engine -B engine/build-mingw -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release -DHighs_DIR="$HIGHS_CFG" \
            -DCMAKE_C_COMPILER="$RT_BIN/gcc" \
            -DCMAKE_CXX_COMPILER="$RT_BIN/g++"
          cmake --build engine/build-mingw -j

      # Install into a temp library: the runner's system R library is not
      # writable by the runner user on Linux. The path deliberately
      # contains a space (a quoting-bug detector, like the product
      # install jobs).
      - name: Install R binding (compile check)
        env:
          HIGHSPREFIX: ${{ runner.temp }}/highs-prefix
        run: |
          set -euo pipefail
          # On Windows the binding links the MinGW engine build.
          if [ "$RUNNER_OS" = "Windows" ]; then
            export TA_ENGINE_BUILD="$GITHUB_WORKSPACE/engine/build-mingw"
            export HIGHSPREFIX="$RUNNER_TEMP/highs-prefix-mingw"
          fi
          mkdir -p "${RUNNER_TEMP}/R lib"
          R CMD INSTALL --library="${RUNNER_TEMP}/R lib" bindings/r/tauargusengine

      - name: Run R binding smoke
        env:
          HIGHSPREFIX: ${{ runner.temp }}/highs-prefix
          R_LIBS: ${{ runner.temp }}/R lib
        run: |
          set -euo pipefail
          # The engine DLLs (MinGW build on Windows) must be loadable
          # when the binding's DLL is loaded.
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="$GITHUB_WORKSPACE/engine/build-mingw/bin:$RUNNER_TEMP/highs-prefix-mingw/bin:$PATH"
          fi
          Rscript bindings/r/tauargusengine/tests/test_binding_smoke.R
