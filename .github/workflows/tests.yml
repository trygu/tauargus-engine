# Build the engine and run the full Python test suite on every push and PR.
# (Wheel building and releasing live in wheels.yml and run only on py-v* tags.)

name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  HIGHS_TAG: v1.15.1

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v5

      - name: Cache HiGHS
        id: highs-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/highs-prefix
          key: highs-${{ matrix.os }}-${{ env.HIGHS_TAG }}

      - name: Build HiGHS from source
        if: steps.highs-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$HIGHS_TAG" https://github.com/ERGO-Code/HiGHS.git highs
          cmake -S highs -B highs/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/highs-prefix"
          cmake --build highs/build -j
          cmake --install highs/build

      - name: Build engine
        run: |
          set -euo pipefail
          HIGHS_CFG="$(dirname "$(find "$RUNNER_TEMP/highs-prefix" -name 'highs-config.cmake' -o -name 'highsConfig.cmake' -o -name 'HighsConfig.cmake' | head -n1)")"
          cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release -DHighs_DIR="$HIGHS_CFG" \
            -DTAUARGUS_CORE_BUILD_TESTS=ON
          cmake --build engine/build -j

      - name: Test native core
        run: ctest --test-dir engine/build/native/core --output-on-failure

      - name: Build and test Python binding
        working-directory: bindings/python
        run: uv run --with pytest --with pybind11 pytest tests -q

      - name: Install R (apt)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y r-base

      - name: Install R (Homebrew)
        if: runner.os == 'macOS'
        run: sudo -E brew install r

      # Install into a temp library: the runner's system R library is not
      # writable by the runner user on Linux.
      - name: Install R binding (compile check)
        env:
          HIGHSPREFIX: ${{ runner.temp }}/highs-prefix
        run: R CMD INSTALL --library="${RUNNER_TEMP}/Rlib" bindings/r/tauargusengine

      - name: Run R binding smoke
        env:
          HIGHSPREFIX: ${{ runner.temp }}/highs-prefix
          R_LIBS: ${{ runner.temp }}/Rlib
        run: Rscript bindings/r/tauargusengine/tests/test_binding_smoke.R
